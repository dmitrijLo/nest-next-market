name: NestJS CI Walkthrough

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend-nestjs

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "backend-nestjs/package-lock.json"

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: run unit tests
        run: npm run test

      - name: upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nestjs-backend-build
          path: |
            backend-nestjs/dist/
            backend-nestjs/package.json
            backend-nestjs/package-lock.json
          retention-days: 7
