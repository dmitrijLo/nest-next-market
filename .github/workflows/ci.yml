name: NestJS CI Walkthrough

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build

      - name: run unit tests
        run: npm run test

      - name: upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nestjs-backend-build
          path: |
            dist/
            package.json
            package-lock.json
          retention-days: 7
